name: KMP Shared Core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-ios-framework:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain diagnostics
        run: |
          uname -a
          xcodebuild -version
          swift --version
      - name: Check shared platform boundary
        run: sh ./scripts/check-shared-boundary.sh
      - name: Bootstrap and verify Gradle Wrapper
        run: |
          sh ./bootstrap-wrapper.sh
          sh ./scripts/verify-wrapper.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run shared JVM tests
        run: sh ./gradlew --no-daemon --stacktrace :shared:jvmTest
      - name: Build iOS XCFramework
        run: sh ./gradlew --no-daemon --stacktrace :shared:assembleQRRepairCoreReleaseXCFramework
      - name: Assert release XCFramework exists
        run: test -d build/shared/XCFrameworks/release/QRRepairCore.xcframework
      - name: Upload QRRepairCore XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QRevy-core-xcframework-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: build/shared/XCFrameworks/release/QRRepairCore.xcframework/**
