name: KMP Shared Core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-ios-framework:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain diagnostics
        run: |
          uname -a
          xcodebuild -version
          swift --version
      - name: Check shared platform boundary
        run: sh ./scripts/check-shared-boundary.sh
      - name: Bootstrap and verify Gradle Wrapper
        run: |
          sh ./bootstrap-wrapper.sh
          sh ./scripts/verify-wrapper.sh
      - uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-provider: basic
      - name: Run shared JVM tests
        run: sh ./gradlew --no-daemon --stacktrace :shared:jvmTest
      - name: Build iOS XCFramework
        run: sh ./gradlew --no-daemon --stacktrace :shared:assembleQRRepairCoreReleaseXCFramework
      - name: Assert release XCFramework exists
        run: test -d shared/build/XCFrameworks/release/QRRepairCore.xcframework
      - name: Upload QRRepairCore XCFramework
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qr-repair-core-xcframework-${{ github.run_number }}
          if-no-files-found: error
          path: shared/build/XCFrameworks/release/QRRepairCore.xcframework/**
