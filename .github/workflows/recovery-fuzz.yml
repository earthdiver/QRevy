name: Extended recovery fuzz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared platform boundary
        run: sh ./scripts/check-shared-boundary.sh
      - name: Bootstrap and verify Gradle Wrapper
        run: |
          sh ./bootstrap-wrapper.sh
          sh ./scripts/verify-wrapper.sh
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Extended deterministic fuzz regression
        run: sh ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest -Dqr.fuzz.iterations=120 -Dqr.imageFuzz.iterations=30
