name: Extended recovery fuzz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared platform boundary
        run: sh ./scripts/check-shared-boundary.sh
      - name: Bootstrap and verify Gradle Wrapper
        run: |
          sh ./bootstrap-wrapper.sh
          sh ./scripts/verify-wrapper.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Extended deterministic fuzz regression
        run: sh ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest -Pqr.testScope=full -Dqr.fuzz.iterations=120
