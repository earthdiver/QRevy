name: Firebase APK distribution

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing upstream release tag
        required: true
        type: string
      apk_asset:
        description: Exact signed APK asset filename in that release
        required: true
        type: string
      release_notes:
        description: Fallback notes when root RELEASE_NOTE.txt is absent
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-distribution
  cancel-in-progress: false

jobs:
  distribute:
    # Install this workflow in the private upstream; use its default branch.
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-distribution
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
      APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test distribution guards
        run: python3 -B -m unittest discover -s scripts -p test_firebase_distribution.py
      - name: Validate configuration and download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_ASSET: ${{ inputs.apk_asset }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess, urllib.parse

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          for name in ('FIREBASE_APP_ID', 'FIREBASE_GROUPS', 'APK_SIGNER_SHA256',
                       'WIF_PROVIDER', 'SERVICE_ACCOUNT', 'RELEASE_TAG'):
              require(os.environ.get(name, '').strip(), f'Missing {name}')
          require(re.fullmatch(r'1:[0-9]+:android:[0-9a-f]+', os.environ['FIREBASE_APP_ID']),
                  'Invalid Firebase Android App ID')
          require(re.fullmatch(r'[a-z0-9-]+(,[a-z0-9-]+)*', os.environ['FIREBASE_GROUPS']),
                  'Use comma-separated Firebase group aliases without spaces')
          fingerprint = os.environ['APK_SIGNER_SHA256'].replace(':', '').lower()
          require(re.fullmatch(r'[0-9a-f]{64}', fingerprint), 'Invalid signer SHA-256')
          asset_name = os.environ.get('APK_ASSET', '')
          require(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.apk', asset_name),
                  'Use an exact APK filename, without a path or wildcard')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'firebase-distribution'
          directory.mkdir(mode=0o700)
          notes_file = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'RELEASE_NOTE.txt'
          require(not notes_file.is_symlink(), 'RELEASE_NOTE.txt must not be a symbolic link')
          if notes_file.exists():
              require(notes_file.is_file(), 'RELEASE_NOTE.txt must be a regular file')
              notes = notes_file.read_bytes().decode('utf-8-sig')
              notes_source = 'Repository root RELEASE_NOTE.txt at the workflow commit'
          else:
              notes = os.environ.get('RELEASE_NOTES', '')
              notes_source = 'Manual release_notes input'
          require(notes.strip(), 'Provide non-empty RELEASE_NOTE.txt or release_notes input')
          (directory / 'notes.txt').write_text(notes, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Release notes source: {notes_source}\n\n')
          (directory / 'signer.txt').write_text(fingerprint, encoding='ascii')
          repository = os.environ['GITHUB_REPOSITORY']
          tag = urllib.parse.quote(os.environ['RELEASE_TAG'], safe='')
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repository}/releases/tags/{tag}']))
          require(not release['draft'], 'Publish the release within upstream before distributing')
          assets = [a for a in release['assets'] if a['name'] == asset_name and a['state'] == 'uploaded']
          require(len(assets) == 1, 'Expected exactly one matching uploaded APK asset')
          asset = assets[0]
          with (directory / 'app.apk').open('wb') as output:
              subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                              f"repos/{repository}/releases/assets/{asset['id']}"],
                             stdout=output, check=True)
          import hashlib
          digest = hashlib.sha256((directory / 'app.apk').read_bytes()).hexdigest()
          if asset.get('digest'):
              require(asset['digest'] == 'sha256:' + digest, 'Release asset digest mismatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"APK asset ID: {asset['id']}\n\nSHA-256: `{digest}`\n")
          PYTHON
      - name: Verify APK signature and application identity
        run: |
          set -euo pipefail
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$tools_dir"
          "$tools_dir/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/firebase-distribution/app.apk" > "$RUNNER_TEMP/firebase-distribution/signature.txt"
          "$tools_dir/aapt" dump badging "$RUNNER_TEMP/firebase-distribution/app.apk" > "$RUNNER_TEMP/firebase-distribution/badging.txt"
          python3 - <<'PYTHON'
          import os, pathlib, re
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'firebase-distribution'
          signature = (directory / 'signature.txt').read_text()
          # SDK 37 labels certificates with the signature scheme (e.g. V3.0 Signer).
          signers = {value.lower() for value in re.findall(
              r'^(?:Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: ([0-9a-fA-F]{64})$',
              signature, re.M)}
          if (not re.search(r'^Number of signers: 1$', signature, re.M)
                  or signers != {(directory / 'signer.txt').read_text()}):
              raise SystemExit('APK signer does not match the configured certificate')
          badging = (directory / 'badging.txt').read_text()
          if not re.search(r"^package: name='io\.github\.earthdiver\.qrrepair' ", badging, re.M):
              raise SystemExit('Unexpected APK package name')
          if re.search(r'^application-debuggable', badging, re.M):
              raise SystemExit('Distribute a non-debuggable release APK')
          PYTHON
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2
      - name: Authenticate to Firebase using GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Distribute APK and tester notes
        run: |
          firebase appdistribution:distribute "$RUNNER_TEMP/firebase-distribution/app.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/firebase-distribution/notes.txt" \
            --non-interactive
      - name: Remove downloaded APK and notes
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/firebase-distribution"
