name: Android APK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared platform boundary
        run: sh ./scripts/check-shared-boundary.sh
      - name: Bootstrap and verify Gradle Wrapper
        run: |
          sh ./bootstrap-wrapper.sh
          sh ./scripts/verify-wrapper.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Shared JVM tests
        run: sh ./gradlew --no-daemon --stacktrace :shared:jvmTest
      - name: Check validation scripts
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Android unit tests and lint
        run: sh ./gradlew --no-daemon --stacktrace :androidApp:testDebugUnitTest -Pqr.testScope=full :androidApp:lint
      - name: Build debug/release APK and release AAB
        run: sh ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Capture release runtime dependency graph
        run: |
          mkdir -p build/androidApp/reports
          sh ./gradlew --no-daemon :androidApp:dependencies --configuration releaseRuntimeClasspath > build/androidApp/reports/release-runtime-dependencies.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QRevy-debug-apk-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: build/androidApp/outputs/apk/debug/*.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QRevy-release-apk-unsigned-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: build/androidApp/outputs/apk/release/*.apk
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QRevy-release-aab-unsigned-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: build/androidApp/outputs/bundle/release/*.aab
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QRevy-android-reports-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: build/androidApp/reports/**
