<title id="title">Landmarks in QR Finder and alignment patterns</title>
<desc id="desc">Orange dots mark the centers of the four corner cells of a seven by seven Finder, and the single center cell of a five by five alignment pattern. Three Finders supply twelve landmarks; each alignment pattern supplies one.</desc>
